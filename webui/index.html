<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/src/assets/tenko_avatar_v4.png" />
    <title>Tenko WebUI · 管理面板</title>
    <script>
      // 首屏前应用主题，避免深色主题闪白；逻辑与 src/composables/useTheme.ts 保持一致。
      ;(function () {
        var pref = localStorage.getItem('tenko-webui-theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Tenko WebUI 需要启用 JavaScript 才能使用管理面板。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
