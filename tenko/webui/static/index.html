<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/webp" href="/webui/assets/tenshi-YnbV7M3S.webp" />
    <title>Tenko WebUI · 管理面板</title>
    <script>
      // 首屏前应用主题，避免深色主题闪白；逻辑与 src/composables/useTheme.ts 保持一致。
      ;(function () {
        var pref = localStorage.getItem('tenko-webui-theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <script type="module" crossorigin src="/webui/assets/index-BrpYDKsm.js"></script>
    <link rel="modulepreload" crossorigin href="/webui/assets/css-DxJ-_Oev.js">

  </head>

  </body>
