<!doctype html>
{#- 所有图片模板共用的底板：虚化立绘色场 + 海报头 + 分区。子模板填 hero_copy、content，按需加 style。 #}
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "SC"; src: url({{ asset("fonts/NotoSansSC-GB2312.woff2") }}) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Cat"; src: url({{ asset("fonts/Catamaran-Latin.woff2") }}) format("woff2"); font-weight: 100 900; }
  :root { --art: url({{ asset("tenko_avatar_v4.png") }}); }
  html, body { margin: 0; background: #141a33; }
  .m { width: 800px; min-height: 800px; box-sizing: border-box; position: relative; overflow: hidden; isolation: isolate; color: #fff; background: #141a33;
    font-family: "SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; padding-bottom: 30px; }

  .field { position: absolute; inset: -15%; z-index: -3; background: var(--art) center 20% / cover;
    filter: blur(80px) saturate(1.6) brightness(.75); transform: scale(1.15); }
  .m::after { content: ""; position: absolute; inset: 0; z-index: -2;
    background: linear-gradient(180deg, rgba(14,18,40,0) 0, rgba(14,18,40,.35) 30%, rgba(12,14,32,.7) 100%); }

  .hero { position: relative; height: 350px; }
  .hero .art { position: absolute; right: -40px; top: -20px; width: 540px; height: calc(100% + 50px); background: var(--art) center 22% / cover;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, rgba(0,0,0,.6) 28%, #000 48%), linear-gradient(0deg, transparent 0, rgba(0,0,0,.7) 22%, #000 40%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .side { position: absolute; right: 26px; top: 30px; writing-mode: vertical-rl; font-family: "Cat"; font-size: 12px;
    letter-spacing: .5em; font-weight: 500; opacity: .75; }
  .copy { position: absolute; left: 40px; top: 62px; bottom: 34px; right: 300px; display: flex; flex-direction: column; }
  .eyebrow { font-family: "Cat"; font-size: 13px; letter-spacing: .32em; font-weight: 600; opacity: .8; }
  .h1 { font-weight: 900; font-size: 76px; line-height: 1; letter-spacing: .02em; margin: 10px 0 14px; white-space: nowrap;
    text-shadow: 0 8px 40px rgba(0,0,0,.35); }
  .sub { font-size: 14px; letter-spacing: .08em; opacity: .75; margin-top: 2px; }
  .sub b { font-weight: 700; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,.14); margin: 0 4px; }
  .sub .warn { color: #ffb4a8; }
  .stats { margin-top: auto; display: flex; }
  .stats div { padding: 0 26px; border-left: 1px solid rgba(255,255,255,.18); font-size: 12.5px; letter-spacing: .1em; opacity: .9; white-space: nowrap; }
  .stats div:first-child { padding-left: 0; border-left: 0; }
  .stats b { display: block; font-family: "Cat"; font-size: 40px; font-weight: 600; line-height: 1.1; letter-spacing: .02em; }
  .stats .dim { opacity: .55; }

  .sec { margin: 34px 40px 0; }
  .sh { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; }
  .sh::after { content: ""; order: 1; flex: 1; height: 1px; background: rgba(255,255,255,.16); }
  .sh .t { font-size: 20px; font-weight: 800; letter-spacing: .08em; }
  .sh .who { order: 2; font-size: 12px; opacity: .6; letter-spacing: .08em; }
  .empty { font-size: 14px; opacity: .55; letter-spacing: .06em; padding: 8px 0; }

  .ico { width: 56px; height: 56px; border-radius: 15px; display: grid; place-items: center; flex: none;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); box-shadow: 0 6px 16px rgba(0,0,0,.2); }
  .ico img { width: 28px; height: 28px; object-fit: contain; filter: brightness(0) invert(1); }
  .no { font-family: "Cat"; font-size: 12px; font-weight: 600; opacity: .45; letter-spacing: .08em; }

  .foot { display: flex; justify-content: space-between; gap: 20px; margin: 26px 40px 0; font-size: 12px; opacity: .6; letter-spacing: .06em; }
  .foot .brand { margin-left: auto; font-family: "Cat"; letter-spacing: .2em; }
{% block style %}{% endblock %}
</style>
</head>
<body>
<div class="m {% block root_class %}{% endblock %}">
  <div class="field"></div>
  <div class="hero">
    <div class="art"></div>
    <div class="side">HINANAWI TENSHI</div>
    <div class="copy">{% block hero_copy %}{% endblock %}</div>
  </div>
  {% block content %}{% endblock %}
  <div class="foot"><span>{% block foot_note %}{% endblock %}</span><span class="brand">TENKO</span></div>
</div>
</body>
</html>
