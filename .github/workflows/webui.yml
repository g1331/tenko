name: WebUI

on:
  push:
    branches:
      - v3
      - main
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and check committed output
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webui

      - name: Type-check and build
        run: npm run build
        working-directory: webui

      # tenko/webui/static 是提交进仓库的构建产物；与源码不一致时必须重新构建并提交。
      - name: Verify committed build output is up to date
        run: |
          if [ -n "$(git status --porcelain tenko/webui/static)" ]; then
            git status --porcelain tenko/webui/static
            echo "::error::tenko/webui/static 与 webui/ 源码构建结果不一致，请在 webui/ 运行 npm run build 并提交产物。"
            exit 1
          fi
