name: WebUI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and check committed output
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      # 生成前端接口类型要导入后端契约（tenko/webui/contracts.py）。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Install dependencies
        run: npm ci
        working-directory: webui

      # src/api/generated.ts 由后端契约生成；契约改了却没重新生成并提交时失败。
      - name: Verify generated API types are up to date
        run: |
          npm run gen:types
          if [ -n "$(git status --porcelain src/api/generated.ts)" ]; then
            git diff -- src/api/generated.ts
            echo "::error::webui/src/api/generated.ts 与 tenko/webui/contracts.py 不一致，请在 webui/ 运行 npm run gen:types 并提交。"
            exit 1
          fi
        working-directory: webui

      - name: Type-check and build
        run: npm run build
        working-directory: webui

      # tenko/webui/static 是提交进仓库的构建产物；与源码不一致时必须重新构建并提交。
      - name: Verify committed build output is up to date
        run: |
          if [ -n "$(git status --porcelain tenko/webui/static)" ]; then
            git status --porcelain tenko/webui/static
            echo "::error::tenko/webui/static 与 webui/ 源码构建结果不一致，请在 webui/ 运行 npm run build 并提交产物。"
            exit 1
          fi
